# Analise do SonarCloud — OS Service
#
# Este arquivo e a fonte da configuracao do scanner. O workflow reutilizavel do
# oficina-infra-fase4 nao repete nada que esteja aqui: o que muda por servico
# mora no servico.
#
# A chave do projeto e a organizacao NAO sao segredo e ficam versionadas.
# Secret, so o SONAR_TOKEN.

sonar.projectKey=Ralima0711_oficina-os-service
sonar.organization=ralima0711
sonar.projectName=OS Service

# Onde esta o codigo que vale analisar. Tudo que e scaffolding do Laravel
# (bootstrap, config, public, storage, vendor) fica de fora: nao e codigo
# nosso e sujaria a metrica dos dois lados — complexidade e cobertura.
sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Relatorios produzidos pelo job de testes do pipeline.
sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.php.tests.reportPath=build/logs/junit.xml

# Providers do Laravel sao fiacao, nao logica: exigir teste deles infla o
# denominador sem aumentar garantia nenhuma.
sonar.coverage.exclusions=app/Providers/**,app/Interface/Http/Swagger/**
